<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Admin - Tambah Berita</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Desain Khusus Form Input Admin */
        .form-container {
            background: white;
            border: 3px solid #16162a;
            box-shadow: 6px 6px 0px #16162a;
            padding: 30px;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #16162a;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #16162a;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
        }
        .form-group textarea {
            height: 150px;
            resize: vertical;
        }
        .btn-submit {
            background: #4B5320;
            color: white;
            border: 3px solid #16162a;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 3px 3px 0px #16162a;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            transform: translate(-2px, -2px);
            box-shadow: 5px 5px 0px #16162a;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Dispen<span>AD</span></div>
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="berita.html">BERITA</a></li>
                <li><a href="about.html">ABOUT</a></li>
            </ul>
        </nav>
    </header>

    <main class="news-container" style="max-width: 800px; margin: 40px auto; padding: 0 20px; display: block;">
        <div class="section-title">Panel Admin - Tambah Berita Baru</div>
        
        <div class="form-container">
            <form id="formBerita">
                <div class="form-group">
                    <label for="title">Judul Berita</label>
                    <input type="text" id="title" placeholder="Masukkan judul berita..." required>
                </div>
                
                <div class="form-group">
                    <label for="image">Link Alamat Gambar/Foto</label>
                    <input type="url" id="image" placeholder="Contoh: https://picsum.photos/800/450 atau img/foto.jpg" required>
                </div>
                
                <div class="form-group">
                    <label for="content">Isi Konten Artikel Berita (Gunakan tag p untuk paragraf)</label>
                    <textarea id="content" placeholder="Tulis isi berita di sini..." required></textarea>
                </div>
                
                <button type="submit" class="btn-submit">Simpan & Publikasikan Berita</button>
            </form>
        </div>

        <div class="section-title" style="margin-top: 40px;">Daftar Semua Berita (Bisa Dihapus)</div>
        <div id="list-berita-admin" style="margin-top: 20px;"></div>
    </main>

    <footer>
        <div class="footer-container">
            <div class="footer-logo">Dispen<span>AD</span></div>
            <div class="footer-info">PANEL ADMIN LOCAL STORAGE</div>
        </div>
    </footer>

    <script src="script.js"></script>
    <script>
        // Menangkap event submit saat tombol diklik
        document.getElementById('formBerita').addEventListener('submit', function(e) {
            e.preventDefault(); 
            addNews(); 
            this.reset();
            tampilkanListAdmin(); // Perbarui daftar setelah menambah berita
        });

        // Fungsi baru: Menampilkan berita bawaan DAN berita lokal di halaman admin
        function tampilkanListAdmin() {
            const listArea = document.getElementById('list-berita-admin');
            let localNews = JSON.parse(localStorage.getItem("news")) || [];
            let htmlKoleksi = "";

            // 1. Tampilkan Berita Utama bawaan codingan (dataBerita dari script.js)
            if (typeof dataBerita !== 'undefined') {
                for (let key in dataBerita) {
                    const b = dataBerita[key];
                    htmlKoleksi += `
                        <div style="background: #f4f4f6; border: 3px solid #16162a; box-shadow: 4px 4px 0px #16162a; margin-bottom: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; gap: 15px;">
                            <div style="display: flex; align-items: center; gap: 15px;">
                                <img src="${b.image}" style="width: 80px; height: 60px; object-fit: cover; border: 2px solid #16162a;">
                                <div>
                                    <h4 style="margin: 0 0 5px 0; color: #16162a; font-size: 1rem;">${b.title} <span style="font-size: 11px; background: #4B5320; color: white; padding: 2px 6px; font-weight: normal; margin-left: 5px;">Bawaan</span></h4>
                                    <small style="color: gray;">${b.date}</small>
                                </div>
                            </div>
                            <button onclick="hapusBeritaBawaan('${key}')" style="background: #ff4d4d; color: white; border: 2px solid #16162a; padding: 8px 12px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0px #16162a; white-space: nowrap;">
                                🗑️ Hapus
                            </button>
                        </div>
                    `;
                }
            }

            // 2. Tampilkan Berita tambahan dari Local Storage
            localNews.forEach(function(b) {
                htmlKoleksi += `
                    <div style="background: white; border: 3px solid #16162a; box-shadow: 4px 4px 0px #16162a; margin-bottom: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; gap: 15px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${b.image}" style="width: 80px; height: 60px; object-fit: cover; border: 2px solid #16162a;">
                            <div>
                                <h4 style="margin: 0 0 5px 0; color: #16162a; font-size: 1rem;">${b.title} <span style="font-size: 11px; background: #2196F3; color: white; padding: 2px 6px; font-weight: normal; margin-left: 5px;">Input</span></h4>
                                <small style="color: gray;">${b.date}</small>
                            </div>
                        </div>
                        <button onclick="deleteNews('${b.id}')" style="background: #ff4d4d; color: white; border: 2px solid #16162a; padding: 8px 12px; font-weight: bold; cursor: pointer; box-shadow: 2px 2px 0px #16162a; white-space: nowrap;">
                            🗑️ Hapus
                        </button>
                    </div>
                `;
            });

            // Jika benar-benar kosong sama sekali
            if (htmlKoleksi === "") {
                listArea.innerHTML = "<p style='padding: 20px; background: white; border: 2px dashed #16162a; font-weight: bold; text-align: center;'>Belum ada berita yang kamu tambahkan.</p>";
            } else {
                listArea.innerHTML = htmlKoleksi;
            }
        }

        // Fungsi khusus untuk menghapus berita bawaan codingan di halaman ini
        function hapusBeritaBawaan(key) {
            if (confirm("Apakah kamu yakin ingin menghapus berita bawaan ini?")) {
                delete dataBerita[key];
                tampilkanListAdmin();
                alert("Berita bawaan berhasil dihapus dari tampilan saat ini!");
            }
        }

        // Jalankan fungsi otomatis saat halaman admin dibuka
        tampilkanListAdmin();
    </script>
</body>
</html>
